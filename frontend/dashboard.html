<script>
document.addEventListener("DOMContentLoaded", function () {

    const aiButton = document.querySelector('a[href="#ai-assistant"]');
    const aiPanel = document.getElementById("ai-assistant-panel");
    const closeButton = document.getElementById("close-ai-assistant");
    const input = document.getElementById("ai-chat-input");
    const sendButton = document.getElementById("ai-chat-send");
    const messages = document.getElementById("ai-chat-messages");

    const API_BASE =
        window.GREENPULSE_API_BASE ||
        "http://localhost:8000";


    // ---------------------------------------------------------
    // OPEN AI ASSISTANT
    // ---------------------------------------------------------

    function openAssistant(event) {

        if (event) {
            event.preventDefault();
        }

        if (aiPanel) {
            aiPanel.style.display = "flex";
        }

        if (input) {
            setTimeout(function () {
                input.focus();
            }, 100);
        }
    }


    // ---------------------------------------------------------
    // CLOSE AI ASSISTANT
    // ---------------------------------------------------------

    function closeAssistant() {

        if (aiPanel) {
            aiPanel.style.display = "none";
        }
    }


    // ---------------------------------------------------------
    // ADD MESSAGE
    // ---------------------------------------------------------

    function addMessage(text, isUser) {

        if (!messages) {
            return;
        }

        const message = document.createElement("div");

        if (isUser) {
            message.className = "ai-message ai-user-message";
        } else {
            message.className = "ai-message";
        }

        message.textContent = text;

        messages.appendChild(message);

        messages.scrollTop = messages.scrollHeight;
    }


    // ---------------------------------------------------------
    // SHOW LOADING MESSAGE
    // ---------------------------------------------------------

    function addLoadingMessage() {

        if (!messages) {
            return;
        }

        const message = document.createElement("div");

        message.className = "ai-message";
        message.id = "ai-loading-message";

        message.textContent =
            "🌱 GreenPulse is analysing your workload...";

        messages.appendChild(message);

        messages.scrollTop = messages.scrollHeight;
    }


    // ---------------------------------------------------------
    // REMOVE LOADING MESSAGE
    // ---------------------------------------------------------

    function removeLoadingMessage() {

        const loadingMessage =
            document.getElementById("ai-loading-message");

        if (loadingMessage) {
            loadingMessage.remove();
        }
    }


    // ---------------------------------------------------------
    // SEND MESSAGE TO FASTAPI BACKEND
    // ---------------------------------------------------------

    async function sendMessage() {

        if (!input || !messages) {
            return;
        }

        const text = input.value.trim();

        if (!text) {
            return;
        }


        // Show user's message
        addMessage(text, true);

        // Clear input
        input.value = "";

        // Show loading
        addLoadingMessage();

        // Disable button while processing
        if (sendButton) {
            sendButton.disabled = true;
        }


        try {

            const response = await fetch(
                `${API_BASE}/api/chat`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },

                    body: JSON.stringify({

                        message: text,

                        /*
                         * Normal mode.
                         * Grid failure simulation will be
                         * connected to a UI button later.
                         */
                        simulate_grid_failure: false,

                        /*
                         * Default carbon budget.
                         */
                        carbon_budget: 120
                    })
                }
            );


            // Try to read backend response
            const data = await response.json();

            // Remove loading message
            removeLoadingMessage();


            // -------------------------------------------------
            // BACKEND ERROR
            // -------------------------------------------------

            if (!response.ok) {

                const errorMessage =
                    data.detail ||
                    "GreenPulse backend returned an error.";

                addMessage(
                    "⚠️ " + errorMessage,
                    false
                );

                return;
            }


            // -------------------------------------------------
            // SUCCESS
            // -------------------------------------------------

            if (data.assistant_message) {

                addMessage(
                    data.assistant_message,
                    false
                );

            } else {

                addMessage(
                    "⚠️ GreenPulse returned an unexpected response.",
                    false
                );
            }


        } catch (error) {

            // Remove loading
            removeLoadingMessage();

            console.error(
                "GreenPulse API error:",
                error
            );


            // Connection error
            addMessage(
                "⚠️ I couldn't connect to the GreenPulse backend. " +
                "Please make sure the FastAPI server is running on " +
                "http://localhost:8000.",
                false
            );

        } finally {

            // Re-enable send button
            if (sendButton) {
                sendButton.disabled = false;
            }

            // Focus input again
            if (input) {
                input.focus();
            }
        }
    }


    // ---------------------------------------------------------
    // EVENT LISTENERS
    // ---------------------------------------------------------

    if (aiButton && aiPanel) {

        aiButton.addEventListener(
            "click",
            openAssistant
        );
    }


    if (closeButton) {

        closeButton.addEventListener(
            "click",
            closeAssistant
        );
    }


    if (sendButton) {

        sendButton.addEventListener(
            "click",
            sendMessage
        );
    }


    if (input) {

        input.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    sendMessage();
                }
            }
        );
    }

});
</script>
