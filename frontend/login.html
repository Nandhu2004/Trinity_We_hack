
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - GreenPulse
    </title>

    <meta
        name="description"
        content="Login to your GreenPulse account"
    >

    <meta
        name="author"
        content="GreenPulse Team"
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/images/favicon.ico"
    >

    <link
        rel="stylesheet"
        href="assets/libs/bootstrap/css/bootstrap.min.css"
    >

    <link
        rel="stylesheet"
        href="assets/libs/bootstrap-icons/bootstrap-icons.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/main.css"
    >

    <style>

        /* ==========================================
           Verification Success Message
           ========================================== */

        .verification-message {

            display: none;

            margin-bottom: 20px;

            padding: 12px 15px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;

            text-align: left;

            background: rgba(25, 135, 84, 0.10);

            color: #198754;

            border: 1px solid rgba(25, 135, 84, 0.20);

        }

        .verification-message.show {

            display: block;

        }

        .verification-message i {

            margin-right: 7px;

        }

    </style>

</head>


<body>


<!-- ==========================================
     START: Authentication Container
     ========================================== -->

<div class="login-wrapper">


    <!-- Background Shapes -->

    <div class="login-bg-shape login-bg-shape-1"></div>

    <div class="login-bg-shape login-bg-shape-2"></div>


    <!-- Login Card -->

    <div class="login-card">


        <!-- Brand -->

        <a
            href="dashboard.html"
            class="login-brand text-decoration-none"
        >

            <i class="bi bi-asterisk"></i>

            <span>
                GreenPulse
            </span>

        </a>


        <!-- Subtitle -->

        <p class="login-subtitle">

            Please sign in to access your dashboard

        </p>


        <!-- ==========================================
             Email Verification Success Message
             ========================================== -->

        <div
            class="verification-message"
            id="verificationMessage"
        >

            <i class="bi bi-check-circle"></i>

            <span>
                Email verified successfully.
                You can now sign in to GreenPulse.
            </span>

        </div>


        <!-- ==========================================
             Login Form
             ========================================== -->

        <form
            id="loginForm"
            class="needs-validation"
            novalidate
        >


            <!-- Email -->

            <div class="login-form-group">

                <label
                    for="email"
                    class="login-form-label"
                >

                    Email Address

                </label>


                <div class="login-input-group">

                    <i
                        class="bi bi-envelope input-icon"
                    ></i>


                    <input
                        type="email"
                        id="email"
                        class="login-input"
                        placeholder="name@company.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- Password -->

            <div class="login-form-group">

                <label
                    for="password"
                    class="login-form-label"
                >

                    Password

                </label>


                <div class="login-input-group">

                    <i
                        class="bi bi-shield-lock input-icon"
                    ></i>


                    <input
                        type="password"
                        id="password"
                        class="login-input login-input-password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle-btn"
                        id="toggle-password"
                        aria-label="Show password"
                    >

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>


            <!-- Options -->

            <div class="login-options">


                <!-- Remember Me -->

                <label class="custom-control-label">

                    <input
                        type="checkbox"
                        class="custom-checkbox-input"
                        id="rememberMe"
                    >

                    <span>
                        Remember Me
                    </span>

                </label>


                <!-- Forgot Password -->

                <a
                    href="#"
                    class="forgot-password-link"
                    id="forgotPassword"
                >

                    Forgot Password?

                </a>


            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="btn-login"
                id="btn-submit"
            >

                <span>
                    Sign In to Dashboard
                </span>

                <i class="bi bi-arrow-right"></i>

            </button>


        </form>


        <!-- Footer -->

        <p class="login-footer-text">

            Don't have an account?

            <a
                href="signup.html"
                id="link-register"
            >

                Register Now

            </a>

        </p>


    </div>

</div>


<!-- ==========================================
     END: Authentication Container
     ========================================== -->


<!-- Bootstrap -->

<script
    src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"
></script>


<!-- Existing Authentication Script -->

<script
    src="assets/js/auth.js"
></script>


<!-- ==========================================
     Login JavaScript
     ========================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* ==========================================
           API Configuration
           ========================================== */

        const API_BASE_URL =
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1"
        ? "http://localhost:8000"
        : "https://trinitywehack-production.up.railway.app";


        /* ==========================================
           Elements
           ========================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const rememberMe =
            document.getElementById(
                "rememberMe"
            );


        const submitButton =
            document.getElementById(
                "btn-submit"
            );


        const togglePassword =
            document.getElementById(
                "toggle-password"
            );


        const verificationMessage =
            document.getElementById(
                "verificationMessage"
            );


        const forgotPassword =
            document.getElementById(
                "forgotPassword"
            );


        /* ==========================================
           Check Verification Redirect

           Signup redirects to:

           login.html?verified=true
           ========================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const verified =
            urlParams.get("verified");


        if (
            verified === "true"
        ) {

            verificationMessage.classList.add(
                "show"
            );


            /*
             * Remove ?verified=true
             * from browser URL.
             */

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        }


        /* ==========================================
           Load Remembered Email
           ========================================== */

        const rememberedEmail =
            localStorage.getItem(
                "greenpulseRememberedEmail"
            );


        if (
            rememberedEmail
        ) {

            emailInput.value =
                rememberedEmail;

            rememberMe.checked =
                true;

        }


        /* ==========================================
           Password Visibility
           ========================================== */

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";


                    this.querySelector("i")
                        .className =
                        "bi bi-eye-slash";


                    this.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                }

                else {

                    passwordInput.type =
                        "password";


                    this.querySelector("i")
                        .className =
                        "bi bi-eye";


                    this.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );


        /* ==========================================
           Login
           ========================================== */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                event.stopPropagation();


                /* ==========================================
                   Browser Validation
                   ========================================== */

                loginForm.classList.add(
                    "was-validated"
                );


                if (
                    !loginForm.checkValidity()
                ) {

                    return;

                }


                /* ==========================================
                   Get Values
                   ========================================== */

                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;


                /* ==========================================
                   Loading State
                   ========================================== */

                const originalButtonHTML =
                    submitButton.innerHTML;


                submitButton.disabled =
                    true;


                submitButton.innerHTML = `

                    <span>
                        Signing In...
                    </span>

                    <i
                        class="bi bi-hourglass-split"
                    ></i>

                `;


                try {


                    /* ==========================================
                       Login API Request
                       ========================================== */

                    const response =
                        await fetch(
                            `${API_BASE_URL}/api/auth/login`,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body: JSON.stringify({

                                    email:
                                        email,

                                    password:
                                        password

                                })

                            }
                        );


                    /* ==========================================
                       Parse Response
                       ========================================== */

                    const data =
                        await response.json();


                    /* ==========================================
                       Login Failed
                       ========================================== */

                    if (
                        !response.ok
                    ) {

                        let errorMessage =
                            "Login failed.";


                        if (
                            data.detail
                        ) {

                            if (
                                Array.isArray(
                                    data.detail
                                )
                            ) {

                                errorMessage =
                                    data.detail
                                        .map(
                                            error =>
                                                error.msg
                                        )
                                        .join("\n");

                            }

                            else {

                                errorMessage =
                                    data.detail;

                            }

                        }


                        alert(
                            errorMessage
                        );


                        submitButton.disabled =
                            false;


                        submitButton.innerHTML =
                            originalButtonHTML;


                        return;

                    }


                    /* ==========================================
                       Validate JWT Response
                       ========================================== */

                    if (
                        !data.access_token
                    ) {

                        console.error(
                            "JWT token missing from login response:",
                            data
                        );


                        alert(
                            "Login succeeded, but authentication token was not received."
                        );


                        submitButton.disabled =
                            false;


                        submitButton.innerHTML =
                            originalButtonHTML;


                        return;

                    }


                    /* ==========================================
                       Remember Me
                       ========================================== */

                    if (
                        rememberMe.checked
                    ) {

                        localStorage.setItem(
                            "greenpulseRememberedEmail",
                            email
                        );

                    }

                    else {

                        localStorage.removeItem(
                            "greenpulseRememberedEmail"
                        );

                    }


                    /* ==========================================
                       Store JWT Token
                       ========================================== */

                    sessionStorage.setItem(
                        "greenpulseToken",
                        data.access_token
                    );


                    /* ==========================================
                       Store User Information
                       ========================================== */

                    sessionStorage.setItem(
                        "greenpulseUser",
                        JSON.stringify(
                            data.user
                        )
                    );


                    /* ==========================================
                       Login Successful
                       ========================================== */

                    console.log(
                        "Login successful."
                    );


                    console.log(
                        "JWT token stored."
                    );


                    console.log(
                        "Logged-in user:",
                        data.user
                    );


                    /* ==========================================
                       Redirect to Dashboard
                       ========================================== */

                    window.location.href =
                        "dashboard.html";


                }

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    alert(
                        "Unable to connect to GreenPulse server. " +
                        "Please make sure the backend is running."
                    );


                    submitButton.disabled =
                        false;


                    submitButton.innerHTML =
                        originalButtonHTML;

                }

            }
        );


        /* ==========================================
           Forgot Password
           ========================================== */

        forgotPassword.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                alert(
                    "Password reset will be added later."
                );

            }
        );


    }

);

</script>


</body>

</html>
